[tool.poetry]
name = "tracsa_utils"
version = "0.5"
description = "reusable admin features for tracsa projects"
authors = ["Luis Morales <lmorales@tracsa.com.mx>"]
license = "mit"
readme = "README.md"
packages = [
    {include = "n1ed"},
    {include = "n1edckeditor"},
    {include = "n1edtinymce"},
    {include = "tracsa_admin"},
]

[tool.poetry.dependencies]
python = "^3.7"
setuptools = "^68.0.0"


[tool.poetry.group.dev.dependencies]
create-license = "^2.1.1"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
